name: Main

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Publish Module
        shell: pwsh
        run: |
          $params = @{
              Path        = "${{ github.workspace }}"
              NuGetApiKey = "${{ secrets.PSGALLERY_API }}"
              ErrorAction = "Stop"
              Verbose = $true
          }
          Publish-Module @params