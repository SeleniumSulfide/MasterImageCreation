name: Main

on:
  push:
    branches:
      - 'main'
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Publish Module
        env:
          PSGALLERY_KEY: ${{ secrets.PSGALLERY_API }}
        shell: pwsh
        run: |
          $params = @{
              Path        = "${{ github.workspace }}/MasterImageCreation"
              NuGetApiKey = "${{ secrets.PSGALLERY_API }}"
              ErrorAction = "Stop"
          }
          Publish-Module @params